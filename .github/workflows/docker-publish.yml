name: docker-publish

on:
  push:
    tags: ["v*"]
  # Lets the maintainer run the smoke test on demand without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ltalignani/microhaplot-2

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    # A cold build compiles ggiraph's C++ chain, pcadapt and RSpectra from
    # source, which takes ~19 minutes even natively on Apple Silicon. The
    # first run of this job was cancelled at a 15-minute limit before it
    # reached the smoke test at all.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load, single-arch, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke-test
          # Persist the layers so later runs — and the publish job below,
          # for its amd64 half — skip the dependency compile entirely.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same script the maintainer runs locally; the image is already built
      # and loaded above, so it only needs to orchestrate and verify.
      - name: Smoke test
        env:
          SKIP_BUILD: "1"
          MICROHAPLOT_VERSION: smoke-test
        run: scripts/docker-smoke-test.sh

  publish:
    needs: build-and-smoke-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # amd64 comes from the cache the smoke-test job just populated, but
    # arm64 is built from scratch under QEMU emulation, which is far slower
    # than the native build.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
