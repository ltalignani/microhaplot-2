name: docker-publish

on:
  push:
    tags: ["v*"]
  # Lets the maintainer run the smoke test on demand without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ltalignani/microhaplot-2

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load, single-arch, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke-test

      # Same script the maintainer runs locally; the image is already built
      # and loaded above, so it only needs to orchestrate and verify.
      - name: Smoke test
        env:
          SKIP_BUILD: "1"
          MICROHAPLOT_VERSION: smoke-test
        run: scripts/docker-smoke-test.sh

  publish:
    needs: build-and-smoke-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
