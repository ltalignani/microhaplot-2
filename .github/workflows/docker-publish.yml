name: docker-publish

on:
  push:
    tags: ["v*"]
  # Lets the maintainer run the smoke test on demand without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ltalignani/microhaplot-2

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    # A cold build compiles ggiraph's C++ chain, pcadapt and RSpectra from
    # source, which takes ~19 minutes even natively on Apple Silicon. With a
    # warm layer cache this job finishes in a couple of minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load, single-arch, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke-test
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      # Same script the maintainer runs locally; the image is already built
      # and loaded above, so it only needs to orchestrate and verify.
      - name: Smoke test
        env:
          SKIP_BUILD: "1"
          MICROHAPLOT_VERSION: smoke-test
        run: scripts/docker-smoke-test.sh

  # One native runner per architecture. Building arm64 on an amd64 runner
  # under QEMU was tried and abandoned: emulating this image's R dependency
  # compile ran for two hours without finishing. GitHub's arm64 runners are
  # free for public repositories, so each half is built on its own hardware
  # and the two are stitched into one manifest by the job below.
  build:
    needs: build-and-smoke-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Name this platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest rather than by tag: a tag can only point at one
      # image, so each architecture is uploaded anonymously and the merge
      # job below is what attaches the tags.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: "type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true"
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest and push it
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"
