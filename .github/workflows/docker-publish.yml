name: docker-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ltalignani/microhaplot-2

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load, single-arch, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke-test

      - name: Smoke test via docker compose
        env:
          MICROHAPLOT_VERSION: smoke-test
        run: |
          docker compose up -d
          trap 'docker compose logs; docker compose down' EXIT

          for port in 3838 3839; do
            for attempt in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${port}/" || true)
              if [ "$code" = "200" ]; then
                echo "port ${port} responded 200"
                break
              fi
              if [ "$attempt" = "30" ]; then
                echo "port ${port} never responded 200 (last: ${code})" >&2
                exit 1
              fi
              sleep 2
            done
          done

  publish:
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
