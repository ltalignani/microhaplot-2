name: pkgdown

# Builds and publishes the documentation site on every push to master.
#
# It used to be built by hand and committed under docs/, which meant the
# published site silently drifted whenever a commit touched DESCRIPTION, the
# README or a vignette without someone remembering to regenerate it. It
# advertised the wrong version twice for exactly that reason.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; the newest push wins.
concurrency:
  group: pkgdown
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Same rule scripts/build-site.sh applies locally: pkgdown renders every
      # Markdown file in the package root, and CLAUDE.md is agent instructions
      # that are deliberately kept out of the repository and off the site.
      # There is no pkgdown setting for this, so it is stripped afterwards.
      - name: Strip private pages
        run: |
          rm -f docs/CLAUDE.html
          if [ -f docs/sitemap.xml ]; then
            grep -v "/CLAUDE\.html</loc>" docs/sitemap.xml > docs/sitemap.tmp
            mv docs/sitemap.tmp docs/sitemap.xml
          fi
          if grep -rl "CLAUDE" docs/ | grep -v LICENSE; then
            echo "CLAUDE.md still referenced in the built site" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
