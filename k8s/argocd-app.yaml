apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microhaplot2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ltalignani/microhaplot
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
