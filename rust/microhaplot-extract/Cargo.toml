# NOTE: `version` must always equal the R package's own DESCRIPTION `Version:`
# exactly (wayfinder ticket #38's decision, implemented in #40) -- bump both
# together by hand at release time. release-binaries.yml's "Confirm
# Cargo.toml's version matches DESCRIPTION's Version" step fails the build if
# they diverge, and R/microhaplot_extract_binary.R's resolve_bin_or_stop()
# checks this at runtime against whatever binary it resolves.
[package]
name = "microhaplot-extract"
version = "2.0.1"
edition = "2021"
description = "Rust replacement for microhaplot's hapture.pl extraction core (wayfinder map #18)"
license = "GPL-3.0-or-later"

[dependencies]
# Pinned to the version verified in research/rust-htslib-build-requirements.md
# (0.47, resolved to 0.47.1 / hts-sys 2.2.1). Bumping this may reopen that
# research — re-check the build requirements before moving off it.
rust-htslib = "0.47"
thiserror = "1"
# CLI argument parsing (ticket #30's batch entry point) and internal-sample
# parallelism (the thread-count contract decided in ticket #23).
clap = { version = "4", features = ["derive"] }
rayon = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# A few seconds of extra build time for a binary this small; the whole
# point of this port is per-read throughput, not compile speed.
lto = true
